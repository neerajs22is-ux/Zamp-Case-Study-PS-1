# =============================================================================
# Autonomous AP Command Center — Google Cloud Run Service Specification
# =============================================================================
# Platform: Google Cloud Run (Knative Serving v1 API)
# Region: asia-south1 (Mumbai, India)
# Scale Profile: Scenario A (Scale-to-zero pilot, max 3 instances)
# Security Governance:
#   - Zero plaintext secrets: Credentials injected via Google Secret Manager.
#   - Non-root unprivileged container runtime.
#   - Ingress enabled with Cloud Pub/Sub and OIDC authentication.
# =============================================================================

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ap-command-center
  labels:
    cloud.googleapis.com/location: asia-south1
    app.kubernetes.io/name: ap-command-center
    app.kubernetes.io/part-of: autonomous-ap
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/description: "Autonomous AP Command Center - Pilot Production Service"
spec:
  template:
    metadata:
      labels:
        app: ap-command-center
      annotations:
        # Autoscaling configuration: Scenario A (Scale to zero, max 3 instances for pilot)
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        # Enable CPU throttling when request idle to ensure free-tier compliance
        run.googleapis.com/cpu-throttling: "true"
        # Temporary CPU boost during container startup to minimize cold-start latency
        run.googleapis.com/startup-cpu-boost: "true"
        # Second-generation execution environment
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: ap-cloudrun-sa@${PROJECT_ID}.iam.gserviceaccount.com
      containers:
        - name: ap-command-center
          image: asia-south1-docker.pkg.dev/${PROJECT_ID}/ap-command-center/app:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          # Startup & Liveness Healthcheck Probes
          startupProbe:
            httpGet:
              path: /api/v1/liveness
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 4
            failureThreshold: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/liveness
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          env:
            # 1. Application Core Configuration
            - name: APP_ENV
              value: "production"
            - name: APP_NAME
              value: "Autonomous AP Command Center"
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: "8080"
            - name: BASE_URL
              value: "https://ap-command-center-${PROJECT_HASH}-el.a.run.app"
            - name: APP_TIMEZONE
              value: "Asia/Kolkata"
            - name: DEBUG
              value: "false"
            - name: LOCAL_AUTH_BYPASS
              value: "false"

            # 2. Supabase Storage Configuration (Zero-AWS)
            - name: STORAGE_PROVIDER
              value: "supabase"
            - name: SUPABASE_STORAGE_BUCKET
              value: "invoices"
            - name: STORAGE_BUCKET_NAME
              value: "invoices"
            - name: SUPABASE_URL
              value: "https://${SUPABASE_PROJECT_REF}.supabase.co"
            - name: STORAGE_REGION
              value: "ap-south-1"

            # 3. Identity Provider (Supabase Auth / Google OAuth)
            - name: IDP_PROVIDER
              value: "supabase_auth"
            - name: SUPABASE_AUDIENCE
              value: "authenticated"
            - name: SUPABASE_ANON_KEY
              value: "${SUPABASE_ANON_KEY}"

            # 4. Gmail Ingestion & Cloud Pub/Sub Webhook Configuration
            - name: GMAIL_CLIENT_ID
              value: "${GMAIL_CLIENT_ID}"
            - name: GMAIL_TARGET_MAILBOX
              value: "ap.invoices@company.com"
            - name: PUBSUB_TOPIC_NAME
              value: "projects/${PROJECT_ID}/topics/gmail-ap-inbox"
            - name: PUBSUB_SERVICE_ACCOUNT_EMAIL
              value: "gmail-pubsub-push@${PROJECT_ID}.iam.gserviceaccount.com"
            - name: PUBSUB_VERIFICATION_AUDIENCE
              value: "https://ap-command-center-${PROJECT_HASH}-el.a.run.app/api/v1/integrations/gmail/pubsub/push"
            - name: PUBSUB_ACK_DEADLINE_SECONDS
              value: "300"
            - name: GMAIL_SYNC_TIMEOUT_SECONDS
              value: "240"
            - name: GMAIL_WATCH_RENEWAL_HOURS
              value: "48"
            - name: GMAIL_RECONCILIATION_HOURS
              value: "6"

            # 4.1 Cloud Scheduler Maintenance Authentication (Stage 7.1)
            - name: CLOUD_SCHEDULER_SERVICE_ACCOUNT_EMAIL
              value: "ap-cloud-scheduler-sa@${PROJECT_ID}.iam.gserviceaccount.com"
            - name: CLOUD_SCHEDULER_VERIFICATION_AUDIENCE
              value: "https://ap-command-center-${PROJECT_HASH}-el.a.run.app"

            # 5. Financial & Statutory Retention Policies
            - name: DUAL_APPROVAL_THRESHOLD_INR
              value: "500000.00"
            - name: RATE_TOLERANCE_PERCENT
              value: "1.50"
            - name: ROUNDING_TOLERANCE_INR
              value: "20.00"
            - name: DOCUMENT_RETENTION_DAYS
              value: "2920"
            - name: ENABLE_PERMANENT_PURGE
              value: "false"

            # 6. Sensitive Server-Side Secrets Injected via Google Secret Manager
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ap-database-url
                  key: latest
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ap-secret-key
                  key: latest
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: ap-supabase-service-key
                  key: latest
            - name: SUPABASE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ap-supabase-jwt-secret
                  key: latest
            - name: GMAIL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ap-gmail-client-secret
                  key: latest
            - name: GMAIL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: ap-gmail-encryption-key
                  key: latest
